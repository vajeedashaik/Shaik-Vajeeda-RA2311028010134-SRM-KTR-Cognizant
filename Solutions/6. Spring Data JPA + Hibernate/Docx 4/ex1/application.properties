# ===================== Primary datasource (Employee / Department) - Docx 4 Hands on 1 =====================
app.datasource.primary.url=jdbc:h2:mem:testdb
app.datasource.primary.driver-class-name=org.h2.Driver
app.datasource.primary.username=sa
app.datasource.primary.password=password

# ===================== Secondary datasource (AuditEvent) - Docx 4 Hands on 9 =====================
app.datasource.audit.url=jdbc:h2:mem:auditdb
app.datasource.audit.driver-class-name=org.h2.Driver
app.datasource.audit.username=sa
app.datasource.audit.password=password

# ===================== Hibernate / JPA =====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console, handy for inspecting both in-memory databases while the app is running
spring.h2.console.enabled=true

# ===================== Hibernate-specific batch processing - Docx 4 Hands on 10 =====================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
